name: Build Quiet Hive

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuietHive/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore QuietHive/Source/QuietHive/QuietHive.csproj
      - name: Build
        run: dotnet build QuietHive/Source/QuietHive/QuietHive.csproj -c Release --no-restore
      - name: Remove source from distributable copy
        run: |
          cp -R QuietHive QuietHive-Release
          rm -rf QuietHive-Release/Source
      - name: Zip RimWorld mod
        run: zip -r QuietHive-RimWorld-1.6.zip QuietHive-Release
      - uses: actions/upload-artifact@v4
        with:
          name: QuietHive-RimWorld-1.6
          path: QuietHive-RimWorld-1.6.zip
